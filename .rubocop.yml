inherit_from: .rubocop_todo.yml

plugins:
  - rubocop-rake
  - rubocop-capybara
require:
  - rubocop-rspec

AllCops:
  NewCops: enable
  TargetRubyVersion: 3.0

Layout/LineLength:
  Enabled: true
  Max: 120
  Exclude:
    - 'spec/**/*_spec.rb'
    - 'netomox.gemspec'

Metrics/MethodLength:
  Max: 25

Metrics/BlockLength:
  Enabled: true
  Exclude:
    - 'spec/**/*_spec.rb'
    - 'netomox.gemspec'

Style/BlockComments:
  Enabled: true
  Exclude:
    - 'spec/spec_helper.rb'

Style/SafeNavigationChainLength:
  Max: 3

RSpecRails:
  Enabled: false

FactoryBot:
  Enabled: false
